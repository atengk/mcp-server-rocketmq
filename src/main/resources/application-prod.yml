# ==============================================================================
# 生产与安全审计环境配置 (Profile: prod)
# 激活方式: --spring.profiles.active=prod 或 SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

server:
  port: ${MCP_SERVER_PORT:${SERVER_PORT:8080}}

rocketmq:
  # 生产环境连接地址（必须由环境变量或外部 Secret 注入）
  namesrv-addr: ${MCP_ROCKETMQ_NAMESRV_ADDR}
  endpoints: ${MCP_ROCKETMQ_ENDPOINTS}
  access-key: ${MCP_ROCKETMQ_ACCESS_KEY}
  secret-key: ${MCP_ROCKETMQ_SECRET_KEY}
  # 生产环境强制开启只读守卫，杜绝一切模型误写
  read-only: ${MCP_ROCKETMQ_READ_ONLY:true}
  # 生产环境默认锁定破坏性工具
  enable-destructive-tools: ${MCP_ROCKETMQ_ENABLE_DESTRUCTIVE_TOOLS:false}
