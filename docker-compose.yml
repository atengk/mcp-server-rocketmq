services:
  mcp-server-rocketmq:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/atengk/mcp-server-rocketmq:${MCP_TAG:-latest}
    container_name: mcp-server-rocketmq
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      - SERVER_PORT=8080
      - MCP_TRANSPORT=${MCP_TRANSPORT:-sse}
      - ROCKETMQ_NAMESRV_ADDR=${ROCKETMQ_NAMESRV_ADDR:-host.docker.internal:9876}
      - ROCKETMQ_ENDPOINTS=${ROCKETMQ_ENDPOINTS:-host.docker.internal:8081}
      - ROCKETMQ_ACCESS_KEY=${ROCKETMQ_ACCESS_KEY:-}
      - ROCKETMQ_SECRET_KEY=${ROCKETMQ_SECRET_KEY:-}
      - ROCKETMQ_READ_ONLY=${ROCKETMQ_READ_ONLY:-false}
      - ROCKETMQ_ENABLE_DESTRUCTIVE_TOOLS=${ROCKETMQ_ENABLE_DESTRUCTIVE_TOOLS:-false}
      - JAVA_OPTS=${JAVA_OPTS:--XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0}
    # 宿主机网络映射：允许容器内通过 host.docker.internal 访问宿主机上运行的 RocketMQ 服务
    extra_hosts:
      - "host.docker.internal:host-gateway"
