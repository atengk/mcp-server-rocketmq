name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ==============================================================================
  # Job 1: 编译产物、生成变更日志并发布 GitHub Release
  # ==============================================================================
  github-release:
    name: 自动发版与产物挂载
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 同步语义化发版版本号 (移除 tag 的 v 前缀)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Syncing Maven version to ${VERSION}..."
          mvn versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false -B

      - name: 编译并打包应用 Fat Jar
        run: mvn clean package -DskipTests -B

      - name: 准备 Release 附件与计算 SHA-256 校验和
        run: |
          mkdir -p dist
          cp target/mcp-server-rocketmq-*.jar dist/
          cd dist
          sha256sum mcp-server-rocketmq-*.jar > checksums.txt
          echo "=== 待分发产物列表与校验和 ==="
          cat checksums.txt

      - name: 基于 Commit 与 PR 生成发布日志
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG_RELEASE.md

      - name: 创建 GitHub Release 并挂载 Fat Jar 附件
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          # 自动识别语义化版本连字符（如 v1.0.0-beta.1 自动打上 Pre-release 标签）
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/mcp-server-rocketmq-*.jar
            dist/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==============================================================================
  # Job 2: 发布 Maven 构件至 GitHub Packages
  # ==============================================================================
  publish-maven:
    name: 发布 Maven 构件至 GitHub Packages
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 JDK 21 与 GitHub Packages 凭据
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
          server-id: github
          server-username: ${{ github.actor }}
          server-password: ${{ secrets.GITHUB_TOKEN }}

      - name: 同步语义化版本号
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false -B

      - name: 部署构件至 GitHub Packages
        run: mvn deploy -DskipTests -B
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==============================================================================
  # Job 3: 构建并发布多架构容器镜像至 GHCR (ghcr.io)
  # ==============================================================================
  publish-docker:
    name: 构建并推送 GHCR 多架构镜像
    needs: github-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 QEMU 模拟器 (多架构支持)
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 镜像元数据 (Tag 与 Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送多架构镜像 (linux/amd64 与 linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
