name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # ==============================================================================
  # Job 1: 编译应用 Fat Jar (用于传统 JVM 运行、Docker 镜像与 Release 附件)
  # ==============================================================================
  build-fatjar:
    name: 构建 Fat Jar
    runs-on: ubuntu-latest
    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: 同步 Maven 发版版本号
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false -B

      - name: 打包 Fat Jar
        run: mvn clean package -DskipTests -B

      - name: 归档 Fat Jar 产物
        uses: actions/upload-artifact@v4
        with:
          name: fatjar
          path: target/mcp-server-rocketmq-*.jar
          if-no-files-found: error

  # ==============================================================================
  # Job 2: 跨平台 GraalVM Native Image 构建矩阵 (Linux x64, Windows x64, macOS arm64)
  # ==============================================================================
  build-native-matrix:
    name: 构建 Native 镜像 (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            binary-source: target/mcp-server-rocketmq
            binary-target: mcp-server-rocketmq-linux-x64
          - os: windows-latest
            platform: win32-x64
            binary-source: target/mcp-server-rocketmq.exe
            binary-target: mcp-server-rocketmq-win32-x64.exe
          - os: macos-latest
            platform: darwin-arm64
            binary-source: target/mcp-server-rocketmq
            binary-target: mcp-server-rocketmq-darwin-arm64

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 GraalVM JDK 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: 同步 Maven 发版版本号 (Bash)
        if: runner.os != 'Windows' && startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mvn versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false -B

      - name: 同步 Maven 发版版本号 (PowerShell)
        if: runner.os == 'Windows' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $ver = $env:GITHUB_REF_NAME.TrimStart('v')
          mvn versions:set "-DnewVersion=$ver" -DgenerateBackupPoms=false -B

      - name: 执行 GraalVM AOT 编译原生二进制
        run: mvn clean native:compile -Pnative -DskipTests -B

      - name: 规范化产物命名 (Unix)
        if: runner.os != 'Windows'
        run: |
          cp ${{ matrix.binary-source }} target/${{ matrix.binary-target }}
          chmod +x target/${{ matrix.binary-target }}

      - name: 规范化产物命名 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "${{ matrix.binary-source }}" -Destination "target/${{ matrix.binary-target }}"

      - name: 归档原生二进制产物
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.platform }}
          path: target/${{ matrix.binary-target }}
          if-no-files-found: error

  # ==============================================================================
  # Job 3: 发布 GitHub Release 并挂载全部多架构二进制与校验和
  # ==============================================================================
  github-release:
    name: 发布 GitHub Release 与校验和
    needs: [build-fatjar, build-native-matrix]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 下载 Fat Jar 产物
        uses: actions/download-artifact@v4
        with:
          name: fatjar
          path: dist/

      - name: 下载 Linux x64 原生二进制
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: dist/

      - name: 下载 Windows x64 原生二进制
        uses: actions/download-artifact@v4
        with:
          name: native-win32-x64
          path: dist/

      - name: 下载 macOS arm64 原生二进制
        uses: actions/download-artifact@v4
        with:
          name: native-darwin-arm64
          path: dist/

      - name: 计算 SHA-256 校验和清单
        run: |
          cd dist
          chmod +x mcp-server-rocketmq-linux-x64 mcp-server-rocketmq-darwin-arm64 || true
          sha256sum * > checksums.txt
          echo "=== 待分发附件与校验和 ==="
          cat checksums.txt

      - name: 基于 Commit 与 PR 生成发布日志
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: .cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG_RELEASE.md

      - name: 创建 GitHub Release 并挂载产物
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==============================================================================
  # Job 4: 构建并发布多架构容器镜像至 GHCR (ghcr.io)
  # ==============================================================================
  publish-docker:
    name: 构建并推送 GHCR 多架构镜像
    needs: build-fatjar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 QEMU 模拟器
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取 Docker 镜像元数据 (Tag 与 Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送多架构镜像 (linux/amd64 与 linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==============================================================================
  # Job 5: 装配二进制并发布 npm Scoped 多包 (@atengk/mcp-server-rocketmq)
  # ==============================================================================
  publish-npm:
    name: 装配并发布 npm 原生多包
    needs: [build-native-matrix, github-release]
    runs-on: ubuntu-latest

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 Node.js 22 并配置 npm 官方注册表
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 下载 Linux x64 原生二进制
        uses: actions/download-artifact@v4
        with:
          name: native-linux-x64
          path: bin-download/linux-x64/

      - name: 下载 Windows x64 原生二进制
        uses: actions/download-artifact@v4
        with:
          name: native-win32-x64
          path: bin-download/win32-x64/

      - name: 下载 macOS arm64 原生二进制
        uses: actions/download-artifact@v4
        with:
          name: native-darwin-arm64
          path: bin-download/darwin-arm64/

      - name: 组装平台包可执行文件与版本同步
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="1.0.0"
          echo "同步 npm 包版本为: ${VERSION}"

          # 1. 组装 win32-x64
          mkdir -p npm/@atengk/mcp-server-rocketmq-win32-x64/bin
          cp bin-download/win32-x64/mcp-server-rocketmq-win32-x64.exe npm/@atengk/mcp-server-rocketmq-win32-x64/bin/mcp-server-rocketmq.exe

          # 2. 组装 linux-x64
          mkdir -p npm/@atengk/mcp-server-rocketmq-linux-x64/bin
          cp bin-download/linux-x64/mcp-server-rocketmq-linux-x64 npm/@atengk/mcp-server-rocketmq-linux-x64/bin/mcp-server-rocketmq
          chmod +x npm/@atengk/mcp-server-rocketmq-linux-x64/bin/mcp-server-rocketmq

          # 3. 组装 darwin-arm64
          mkdir -p npm/@atengk/mcp-server-rocketmq-darwin-arm64/bin
          cp bin-download/darwin-arm64/mcp-server-rocketmq-darwin-arm64 npm/@atengk/mcp-server-rocketmq-darwin-arm64/bin/mcp-server-rocketmq
          chmod +x npm/@atengk/mcp-server-rocketmq-darwin-arm64/bin/mcp-server-rocketmq

          # 4. 同步 4 个 package.json 的版本号与 optionalDependencies
          node -e '
            const fs = require("fs");
            const ver = process.argv[1];
            const pkgs = [
              "npm/@atengk/mcp-server-rocketmq-win32-x64/package.json",
              "npm/@atengk/mcp-server-rocketmq-linux-x64/package.json",
              "npm/@atengk/mcp-server-rocketmq-darwin-arm64/package.json",
              "npm/@atengk/mcp-server-rocketmq/package.json"
            ];
            for (const p of pkgs) {
              const j = JSON.parse(fs.readFileSync(p, "utf8"));
              j.version = ver;
              if (j.optionalDependencies) {
                for (const k of Object.keys(j.optionalDependencies)) {
                  j.optionalDependencies[k] = ver;
                }
              }
              fs.writeFileSync(p, JSON.stringify(j, null, 2) + "\n");
            }
          ' "$VERSION"

      - name: 运行 npm 包装器跨平台调度回归测试 (接缝 3)
        run: node --test npm/test/cli.test.js

      - name: 发布至 npm 官方注册表
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "=== 依次发布平台二进制子包与主协调包 ==="
          npm publish ./npm/@atengk/mcp-server-rocketmq-win32-x64 --access public
          npm publish ./npm/@atengk/mcp-server-rocketmq-linux-x64 --access public
          npm publish ./npm/@atengk/mcp-server-rocketmq-darwin-arm64 --access public
          npm publish ./npm/@atengk/mcp-server-rocketmq --access public
          echo "=== npm 多包发布圆满完成 ==="

      - name: 未配置 NPM_TOKEN 警告提示
        if: env.NPM_TOKEN == ''
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "::warning::未检测到 NPM_TOKEN Secret，跳过 npm 发布阶段。产物已成功在本地打包与校验。"
